services:
  yologate:
    image: ghcr.io/anfilhabeeb/yologate:latest
    build: .
    container_name: yologate
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - yologate-data:/data
    environment:
      VC_CONFIDENCE: "0.35"
      VC_MAX_FPS: "10"
      # VC_MODEL: /models/yolo11n.pt   # mount your own weights to use a bigger model

  # Optional synthetic camera for trying the portal without real hardware:
  #   docker compose --profile demo up
  #   then add camera URL http://fake-camera:8081/video
  fake-camera:
    profiles: ["demo"]
    image: ghcr.io/anfilhabeeb/yologate:latest
    build: .
    command: ["python", "tools/fake_camera.py", "--port", "8081"]
    ports:
      - "8081:8081"

volumes:
  yologate-data:
